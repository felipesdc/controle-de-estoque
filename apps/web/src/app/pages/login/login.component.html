<section class="login"><mat-card><div class="brand"><mat-icon>inventory_2</mat-icon><span>Mr. Mordis<small>CONTROLE DE ESTOQUE</small></span></div><h1>Bem-vindo de volta</h1><p>Entre para acompanhar seu estoque.</p><p class="notice" role="status" *ngIf="aviso">{{ aviso }}</p><p class="error" role="alert" *ngIf="errorMessage">{{ errorMessage }}</p>
<form (ngSubmit)="login()" #loginForm="ngForm"><mat-form-field appearance="outline"><mat-label>Usuário ou e-mail</mat-label><input matInput [(ngModel)]="usuario_login" name="usuario_login" autocomplete="username" required maxlength="254" [disabled]="isLoading"></mat-form-field><mat-form-field appearance="outline"><mat-label>Senha</mat-label><input matInput type="password" [(ngModel)]="usuario_password" name="usuario_password" autocomplete="current-password" required [disabled]="isLoading"></mat-form-field><button mat-flat-button color="primary" type="submit" [disabled]="loginForm.invalid||isLoading">{{ isLoading?'Entrando…':'Entrar' }}</button></form><small class="session-note">A sessão dura até 2 horas. Alterações de acesso exigem novo login.</small></mat-card></section>

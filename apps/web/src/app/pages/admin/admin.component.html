<section class="admin"><header><div><span class="eyebrow">GERENCIAMENTO DO SISTEMA</span><h1>Administração</h1><p>Escolha uma área para organizar os dados e os acessos.</p></div><a mat-stroked-button routerLink="/home/dashboard">Voltar à visão geral</a></header>
  <ng-container *ngIf="inicio; else detalhes"><div class="cards"><section *ngFor="let s of secoes"><h2>{{ s.titulo }}</h2><p>{{ s.texto }}</p><nav [attr.aria-label]="s.titulo"><a *ngFor="let l of s.links" [routerLink]="l.url"><mat-icon>{{ l.icone }}</mat-icon><span>{{ l.nome }}</span><mat-icon class="arrow">arrow_forward</mat-icon></a></nav></section></div></ng-container>
  <ng-template #detalhes><a class="back" routerLink="/admin"><mat-icon>arrow_back</mat-icon> Todas as áreas administrativas</a><div class="admin-crud-container"><router-outlet></router-outlet></div></ng-template>
</section>

name: Validar aplicação
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t controle-de-estoque-api:latest apps/api
      - run: ./scripts/testar-api.sh
      - run: BACKUP_VERIFY_IMAGE=controle-de-estoque-api:latest ./scripts/testar-backup.sh
      - run: docker run --rm -v "$PWD/apps/api:/project:ro" -w /project node:22-bookworm-slim npm audit --audit-level=moderate
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target build -t estoque-web-tests apps/web
      - run: docker run --rm --network none estoque-web-tests npm test
      - run: docker run --rm estoque-web-tests npm audit --audit-level=moderate
